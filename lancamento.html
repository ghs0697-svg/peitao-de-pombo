<style>

<script>
(function () {
  var GRUPO = 'https://chat.whatsapp.com/I6HvtegVKmd2H8eIBTcIH1?mode=gi_t';
  var API = 'https://peitao-de-pombo-api-es21.vercel.app';
  var de = (new URLSearchParams(location.search).get('de') || 'outro').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 20) || 'outro';
  try { fetch(API + '/api/clique?para=meteorico&de=' + encodeURIComponent(de), { method: 'POST', keepalive: true }).catch(function () {}); } catch (e) {}
  setTimeout(function () { location.replace(GRUPO); }, 150);
})();
</script>
