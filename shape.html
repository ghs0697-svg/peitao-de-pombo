<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shape de Elite · Método GH</title>
<!--
  Atalho NOSSO pra página de vendas do Shape (escada Peitão → Shape, Sala #3244 e #3245): registra o
  toque com a origem (?de=bot | chat | whats | pagina | app | outro) em para=shape e manda pra
  shapedeelite.com.br com a marca utm_source=peitao, utm_medium=<origem>, utm_campaign=escada.
  Quem não roda script (robô de prévia de link) não conta e cai no refresh abaixo.
-->
<noscript><meta http-equiv="refresh" content="0;url=https://shapedeelite.com.br/?utm_source=peitao&amp;utm_medium=outro&amp;utm_campaign=escada"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A0A0B; color: #EDE9E0; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 10px 0 4px; }
  p { color: #8f8878; font-size: 14px; margin: 0; }
  a { display: inline-block; margin-top: 18px; padding: 13px 22px; border-radius: 10px; background: #25D366; color: #062b16; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<div>
  <div style="font-size:34px">🐦</div>
  <h1>Abrindo o Shape de Elite…</h1>
  <p>Se não abrir sozinho, toca no botão.</p>
  <a href="https://shapedeelite.com.br/?utm_source=peitao&amp;utm_medium=outro&amp;utm_campaign=escada">VER O SHAPE DE ELITE</a>
</div>
<script>
(function () {
  var GRUPO = 'https://shapedeelite.com.br/';
  var API = 'https://peitao-de-pombo-api-es21.vercel.app';
  var de = (new URLSearchParams(location.search).get('de') || 'outro').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 20) || 'outro';
  try { fetch(API + '/api/clique?para=shape&de=' + encodeURIComponent(de), { method: 'POST', keepalive: true }).catch(function () {}); } catch (e) {}
  setTimeout(function () { location.replace(GRUPO + '?utm_source=peitao&utm_medium=' + encodeURIComponent(de) + '&utm_campaign=escada'); }, 150);
})();
</script>
</body>
</html>
